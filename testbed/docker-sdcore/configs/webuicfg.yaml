# SPDX-License-Identifier: Apache-2.0
# omec webconsole (5gc-webui rel-2.1.3) config for the SD-Core testbed.
#
# This single process serves two HTTP servers:
#   * cfgport (5000) - the config API used to provision device-groups / slices
#                      (POST /config/v1/device-group/{name}, /network-slice/{name})
#   * 5001 (hard-coded) - the NFConfig API the SMF polls
#                      (GET /nfconfig/session-management)
info:
  version: 1.0.0
  description: WebUI configuration (sd-core testbed)

configuration:
  mongodb:
    name: sdcore
    url: mongodb://mongo:27017
  spec-compliant-sdf: false
  cfgport: 5000
  enableAuthentication: false   # open config + nfconfig APIs (testbed only)

logger:
  WEBUI:
    debugLevel: info
    ReportCaller: false
