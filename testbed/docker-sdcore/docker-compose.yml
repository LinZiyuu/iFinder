# SPDX-License-Identifier: Apache-2.0
# SD-Core testbed: omec SMF v3.0.1 <--N4/PFCP--> UPF (upf-epc) v2.1.2
#
# omec SMF v3.0.1 has no static UPF config; it polls the webconsole for the
# slice + UPF and then initiates the N4 association. So the minimal set that
# makes N4 actually come up is: mongo + webconsole + smf + upf(bess+pfcpiface).
#
#   bring up:   docker compose up -d
#   provision:  ./provision.sh           (pushes the slice -> SMF learns the UPF)
#   verify:     docker compose logs -f smf | grep -i -E 'assoc|pfcp|upf'
name: sdcore

# Pinned subnet so iFinder's Exploitation Agent can target fixed N4 IPs
# (discover_nf_endpoints needs a service with an ipv4_address). Host-routable.
networks:
  sdcore:
    name: ifinder-sdcore-n4
    ipam:
      config:
        - subnet: 10.100.1.0/24

services:
  # ----- config store for the webconsole --------------------------------------
  # The webconsole requires Mongo to be a replica set (it uses transactions /
  # change streams), so we run a single-node replica set and bootstrap it with
  # the mongo-init one-shot. The healthcheck only passes once a primary exists.
  mongo:
    image: mongo:7.0
    container_name: sdcore-mongo
    networks: [sdcore]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.hello().isWritablePrimary || quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # one-shot: wait for mongod, then initiate the single-node replica set "rs0"
  mongo-init:
    image: mongo:7.0
    container_name: sdcore-mongo-init
    networks: [sdcore]
    depends_on:
      mongo:
        condition: service_started
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        until mongosh --host mongo --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do sleep 2; done
        mongosh --host mongo --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }"
        echo "replica set rs0 ready"

  # ----- webconsole: config API (:5000) + NFConfig API the SMF polls (:5001) ---
  webconsole:
    image: omecproject/5gc-webui:rel-2.1.3
    container_name: sdcore-webconsole
    networks: [sdcore]
    command: ["webconsole", "-cfg", "/sdcore/config/webuicfg.yaml"]
    volumes:
      - ./configs/webuicfg.yaml:/sdcore/config/webuicfg.yaml:ro
    ports:
      - "5000:5000"   # config API (provisioning)
      - "5001:5001"   # NFConfig API (GET /nfconfig/session-management) - for inspection
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ----- SMF: polls webconsole:5001, initiates N4/PFCP to upf:8805 -------------
  # Service is named `smf` -> iFinder EA maps it to NF "SMF" and targets the
  # pinned IP below for SMF-side PFCP candidates.
  smf:
    image: omecproject/5gc-smf:rel-3.0.1
    container_name: sdcore-smf
    hostname: smf
    networks:
      sdcore:
        ipv4_address: 10.100.1.5   # pinned: iFinder EA targets the SMF N4 here
    command:
      - smf
      - -cfg
      - /sdcore/config/smfcfg.yaml
      - -uerouting
      - /sdcore/config/uerouting.yaml
    volumes:
      - ./configs/smfcfg.yaml:/sdcore/config/smfcfg.yaml:ro
      - ./configs/uerouting.yaml:/sdcore/config/uerouting.yaml:ro
    depends_on:
      webconsole:
        condition: service_started
    restart: unless-stopped

  # ----- UPF: pfcpiface (the omec Go PFCP/N4 control plane) as ONE self-contained
  # container. Named `upf` + pinned IP so iFinder's EA maps it to NF "UPF" and both
  # restarts AND tails THIS container — the one that runs the PFCP code and panics.
  # It reads its own eth0 (10.100.1.4) for the access/core addresses, so no bessd /
  # shared-netns split is needed (that split made the EA watch the wrong container).
  # What this exercises is the N4 control plane (association / heartbeat / session
  # PFCP); the BESS af_packet datapath forwarded nothing here and is intentionally
  # dropped so the NF is a single restartable unit the EA can observe and reset.
  # (pfcpiface logs gRPC-to-bessd errors at startup — harmless; the N4 listener and
  # all PFCP message handlers come up regardless.)
  upf:
    image: omecproject/upf-epc-pfcpiface:rel-2.1.2
    container_name: sdcore-upf
    hostname: upf
    networks:
      sdcore:
        ipv4_address: 10.100.1.4   # pinned: N4 host; EA targets + tails this container
    # --bess upf-bess:10514 -> the datapath is a SEPARATE container reached over the
    # network, so upf.isConnected() is Ready and the SMF association is accepted.
    command: ["--config", "/opt/bess/bessctl/conf/upf.jsonc", "--bess", "upf-bess:10514"]
    volumes:
      - ./configs/upf.jsonc:/opt/bess/bessctl/conf/upf.jsonc:ro
    depends_on:
      upf-bess:
        condition: service_started
    restart: unless-stopped

  # ----- UPF datapath: bessd in its OWN container/netns/IP. pfcpiface reaches it over
  # the network (not a shared netns), so the EA restarting `upf` never disturbs bessd
  # and bessd's gRPC stays reachable -> isConnected() Ready -> association accepted.
  # `upf-bess` does NOT map to NF "UPF" in iFinder (only `upf` does), so the EA still
  # watches/restarts the pfcpiface container where panics surface.
  upf-bess:
    image: omecproject/upf-epc-bess:rel-2.1.2
    container_name: sdcore-upf-bess
    hostname: upf-bess
    networks:
      sdcore:
        ipv4_address: 10.100.1.6
    privileged: true                       # hugepages + veth + af_packet
    entrypoint: ["bash", "/bess-entrypoint.sh"]
    volumes:
      - ./upf/bess-entrypoint.sh:/bess-entrypoint.sh:ro
      - ./configs/upf-bess.jsonc:/opt/bess/bessctl/conf/upf.jsonc:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

volumes:
  mongo-data:
