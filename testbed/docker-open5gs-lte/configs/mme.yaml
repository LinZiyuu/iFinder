# Open5GS MME (4G EPC) — S1AP (eNB), S11 GTP-C to SGW-C, S6a Diameter to HSS.
# Pinned to 10.100.2.10 so iFinder's EA targets MME GTP-C (S11) here. Logs to stdout
# (no logger.file.path) so crashes (ogs_assert / SIGABRT) surface in `docker logs`.
global:
  max:
    ue: 1024

mme:
  freeDiameter: /open5gs/conf/mme.conf
  s1ap:
    server:
      - address: 10.100.2.10
  gtpc:
    server:
      - address: 10.100.2.10
    client:
      sgwc:
        - address: 10.100.2.11
      smf:
        - address: 10.100.2.13
  gummei:
    - plmn_id:
        mcc: 999
        mnc: 70
      mme_gid: 2
      mme_code: 1
  tai:
    - plmn_id:
        mcc: 999
        mnc: 70
      tac: 1
  security:
    integrity_order: [ EIA2, EIA1, EIA0 ]
    ciphering_order: [ EEA0, EEA1, EEA2 ]
  network_name:
    full: Open5GS
  mme_name: open5gs-mme0
