# UERANSIM UE — matches the test subscriber registered by register-subscriber.sh
supi: 'imsi-001010000000001'   # IMSI must exist in open5gs Mongo (PLMN 001/01)
mcc: '001'
mnc: '01'

protectionScheme: 0           # 0 = NULL scheme (no SUCI encryption)
homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
homeNetworkPublicKeyId: 1
routingIndicator: '0000'

# Default open5gs test credentials (must match the subscriber's security.k / opc)
key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
op: 'E8ED289DEBA952E4283B54E88E6183CA'
opType: 'OPC'                  # 'OPC' (we provide OPc, not OP)
amf: '8000'
imei: '356938035643803'
imeiSv: '4370816125816151'

# Search for the gNB at its bridge IP (gnb.yaml linkIp)
gnbSearchList:
  - 10.33.33.20

uacAic:
  mps: false
  mcs: false
uacAcc:
  normalClass: 0
  class11: false
  class12: false
  class13: false
  class14: false
  class15: false

# PDU session: DNN 'internet' on S-NSSAI sst1/sd0x000001 (must match subscriber slice)
sessions:
  - type: 'IPv4'
    apn: 'internet'
    slice:
      sst: 1
      sd: 0x000001

configured-nssai:
  - sst: 1
    sd: 0x000001

default-nssai:
  - sst: 1
    sd: 0x000001

integrity:
  IA1: true
  IA2: true
  IA3: true
ciphering:
  EA1: true
  EA2: true
  EA3: true

integrityMaxRate:
  uplink: 'full'
  downlink: 'full'
